services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ielts_reading}
      POSTGRES_USER: ${POSTGRES_USER:-ielts_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ielts_reading}
      DB_USERNAME: ${POSTGRES_USER:-ielts_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      DICTIONARY_MW_API_KEY: ${DICTIONARY_MW_API_KEY:-}
      PDF_IMPORT_STORAGE_DIR: /data/pdf-imports
      PDF_IMPORT_CLI_JAR: /opt/parser.jar
      PDF_IMPORT_HYBRID_URL: http://ocr:5002
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pdf-imports:/data/pdf-imports

  ocr:
    build:
      context: ./ocr
    volumes:
      - ocr-models:/models

volumes:
  postgres-data:
  pdf-imports:
  ocr-models:
